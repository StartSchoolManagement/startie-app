<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Startie – Highscores</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="top-banner">
  <div id="banner-wrapper">
    <div id="banner-left"></div>
    <div id="banner-center">
      <img src="/top-banner.png" alt="StartSchool LOGIC RUN" id="banner-img">
    </div>
    <div id="banner-right"></div>
  </div>
</div>

<div id="highscores-container">
  <div id="highscores-content">
    <h1>LEADERBOARD</h1>
    
    <div id="player-status">
      <p>
        Playing as: <strong id="player-name"></strong>
        <span id="player-score"></span>
      </p>
    </div>
    
    <div id="leaderboard-display">
      <div id="leaderboard-list">
        <div class="leaderboard-loading">Loading...</div>
      </div>
    </div>
    
    <div id="highscores-actions">
      <button id="home-btn-highscore" class="highscore-btn">Home</button>
      <button id="play-again-btn" class="highscore-btn">Play Again</button>
    </div>
  </div>
</div>

<script type="module">
import { initSupabase } from '/src/utils/supabase.ts';
import { 
  getPlayerSession, 
  subscribeToLeaderboard
} from '/src/utils/player-session.ts';
import { saveMusicPosition } from '/src/utils/sounds.ts';

// Initialize
initSupabase();

const leaderboardList = document.getElementById('leaderboard-list');
const playerStatus = document.getElementById('player-status');
const playerName = document.getElementById('player-name');
const playerScore = document.getElementById('player-score');

// Show current player status
function showPlayerStatus(session) {
  if (session) {
    playerStatus.style.display = 'block';
    playerName.textContent = session.username;
    playerScore.textContent = `Score: ${session.score.toLocaleString()}`;
  }
}

// Check for existing session
const session = getPlayerSession();
if (session) {
  showPlayerStatus(session);
}

// Update leaderboard display
function updateLeaderboard(leaderboard) {
  leaderboardList.innerHTML = '';
  
  if (!leaderboard || leaderboard.length === 0) {
    leaderboardList.innerHTML = '<p class="leaderboard-empty">No scores yet. Be the first to play!</p>';
    return;
  }
  
  const currentSession = getPlayerSession();
  
  leaderboard.forEach((entry, index) => {
    const entryDiv = document.createElement('div');
    entryDiv.className = 'highscore-entry';
    const isCurrentPlayer = currentSession && entry.username === currentSession.username;
    
    // Medal for top 3
    let medal = '';
    if (index === 0) medal = '🥇';
    else if (index === 1) medal = '🥈';
    else if (index === 2) medal = '🥉';
    
    const codeClass = isCurrentPlayer ? 'highscore-code highscore-code--current' : 'highscore-code';
    
    entryDiv.innerHTML = `
      <span class="highscore-rank">${medal || '#' + (index + 1)}</span>
      <span class="${codeClass}">${entry.username}</span>
      <span class="highscore-level">Lv.${entry.current_level || '?'}</span>
      <span class="highscore-score">${entry.score.toLocaleString()}</span>
    `;
    leaderboardList.appendChild(entryDiv);
  });
}

// Subscribe to real-time updates
const unsubscribe = subscribeToLeaderboard(updateLeaderboard);

// Navigation
document.getElementById('home-btn-highscore').onclick = () => {
  saveMusicPosition();
  window.location.href = '/index.html';
};

document.getElementById('play-again-btn').onclick = () => {
  saveMusicPosition();
  window.location.href = '/play.html?level=1';
};

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  unsubscribe();
});
</script>

<style>
#highscores-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  max-width: 600px;
  margin: 0 auto;
}

#highscores-content {
  width: 100%;
  background: var(--ui-gray);
  padding: 2rem;
  border: 2px solid var(--pink);
}

#highscores-content h1 {
  color: var(--white);
  text-align: center;
  margin-bottom: 1.5rem;
  font-family: 'Courier New', monospace;
  font-size: 1.8rem;
}

#leaderboard-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 1.5rem 0;
  min-height: 300px;
}

.highscore-entry {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  background: var(--dark-gray);
  border-radius: 4px;
  font-family: 'Courier New', monospace;
}

.highscore-rank {
  width: 40px;
  font-size: 1.1em;
}

.highscore-code {
  flex: 1;
  color: var(--white);
  font-size: 1.1em;
}

.highscore-level {
  margin-right: 15px;
}

.highscore-score {
  color: var(--pink);
  font-weight: bold;
  font-size: 1.1em;
}

#highscores-actions {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
}

.highscore-btn {
  flex: 1;
  padding: 0.75rem;
  background: var(--pink);
  border: none;
  color: var(--white);
  font-weight: bold;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  border-radius: 4px;
}

.highscore-btn:hover {
  background: #ff6fb8;
}
</style>
</body>
</html>
